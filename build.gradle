import org.jetbrains.intellij.platform.gradle.IntelliJPlatformType
import org.jetbrains.intellij.platform.gradle.TestFrameworkType

plugins {
    id 'java'
    id 'org.jetbrains.intellij.platform' version '2.10.5'
}

group = 'com.dush'
version = providers.gradleProperty('pluginVersion').get()

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// Ship the license with the plugin.
tasks.named('jar') {
    from(layout.projectDirectory.file('LICENSE')) { into 'META-INF' }
    from(layout.projectDirectory.file('NOTICE')) { into 'META-INF' }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

repositories {
    mavenCentral()
    intellijPlatform {
        defaultRepositories()
    }
}

dependencies {
    intellijPlatform {
        intellijIdeaCommunity(providers.gradleProperty('platformVersion'))
        bundledPlugin('com.intellij.java')
        bundledPlugin('org.jetbrains.kotlin')
        testFramework(TestFrameworkType.Platform.INSTANCE)
        testFramework(TestFrameworkType.Plugin.Java.INSTANCE)
    }
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.opentest4j:opentest4j:1.3.0'
}

intellijPlatform {
    // The plugin has no settings pages, so there is nothing to index.
    buildSearchableOptions = false

    // ./gradlew verifyPlugin checks API compatibility with the oldest supported and a current IDE.
    pluginVerification {
        ides {
            ide(IntelliJPlatformType.IntellijIdeaCommunity, providers.gradleProperty('platformVersion').get())
            ide(IntelliJPlatformType.IntellijIdea, '2026.3')
        }
    }

    pluginConfiguration {
        version = providers.gradleProperty('pluginVersion')
        ideaVersion {
            sinceBuild = providers.gradleProperty('pluginSinceBuild')
            untilBuild = provider { null }
        }
    }
}
