<body>
Adds a Protostuff <code>@Tag</code> to the field at the caret, using one more than the highest number already used
in the class or its superclasses. Gaps aren't filled, because a gap is often a removed field whose number shouldn't
be reused. Adds <code>import io.protostuff.Tag</code> when it's missing.
